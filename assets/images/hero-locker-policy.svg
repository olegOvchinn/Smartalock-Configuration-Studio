<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="900" cy="300" r="400" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="240" cy="1320" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- idle-duration clock face -->
  <g transform="translate(600,560)">
    <circle r="230" fill="#FFFFFF" opacity="0.06"/>
    <circle r="230" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <circle r="188" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.22"/>

    <!-- hour ticks -->
    <g stroke="#FFFFFF" stroke-width="3" opacity="0.35">
      <line x1="0" y1="-230" x2="0" y2="-206"/>
      <line x1="0" y1="230" x2="0" y2="206"/>
      <line x1="-230" y1="0" x2="-206" y2="0"/>
      <line x1="230" y1="0" x2="206" y2="0"/>
      <line x1="-162" y1="-162" x2="-146" y2="-146"/>
      <line x1="162" y1="-162" x2="146" y2="-146"/>
      <line x1="-162" y1="162" x2="-146" y2="146"/>
      <line x1="162" y1="162" x2="146" y2="146"/>
    </g>

    <!-- clock hands -->
    <line x1="0" y1="0" x2="0" y2="-140" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
    <line x1="0" y1="0" x2="110" y2="60" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <circle r="12" fill="#0071E3" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- policy rule bars -->
  <g transform="translate(300,1080)">
    <rect x="0" y="0" width="600" height="70" rx="16" fill="#FFFFFF" opacity="0.08"/>
    <rect x="0" y="0" width="600" height="70" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.3"/>
    <circle cx="35" cy="35" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.4"/>
    <line x1="70" y1="30" x2="260" y2="30" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
    <line x1="70" y1="50" x2="200" y2="50" stroke="#FFFFFF" stroke-width="4" opacity="0.2"/>

    <rect x="0" y="94" width="600" height="70" rx="16" fill="#0071E3" opacity="0.5"/>
    <rect x="0" y="94" width="600" height="70" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.55"/>
    <circle cx="35" cy="129" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6"/>
    <line x1="70" y1="124" x2="290" y2="124" stroke="#FFFFFF" stroke-width="4" opacity="0.45"/>
    <line x1="70" y1="144" x2="230" y2="144" stroke="#FFFFFF" stroke-width="4" opacity="0.32"/>

    <rect x="0" y="188" width="600" height="70" rx="16" fill="#FFFFFF" opacity="0.06"/>
    <rect x="0" y="188" width="600" height="70" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.26"/>
    <circle cx="35" cy="223" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.36"/>
    <line x1="70" y1="218" x2="240" y2="218" stroke="#FFFFFF" stroke-width="4" opacity="0.26"/>
    <line x1="70" y1="238" x2="180" y2="238" stroke="#FFFFFF" stroke-width="4" opacity="0.18"/>
  </g>
</svg>
