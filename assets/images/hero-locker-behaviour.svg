<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="960" cy="300" r="400" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="220" cy="1300" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- locker bank grid -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.22">
    <rect x="180" y="480" width="150" height="210" rx="10"/>
    <rect x="350" y="480" width="150" height="210" rx="10"/>
    <rect x="520" y="480" width="150" height="210" rx="10"/>
    <rect x="690" y="480" width="150" height="210" rx="10"/>
    <rect x="860" y="480" width="150" height="210" rx="10"/>

    <rect x="180" y="710" width="150" height="210" rx="10"/>
    <rect x="350" y="710" width="150" height="210" rx="10"/>
    <rect x="520" y="710" width="150" height="210" rx="10"/>
    <rect x="690" y="710" width="150" height="210" rx="10"/>
    <rect x="860" y="710" width="150" height="210" rx="10"/>

    <rect x="180" y="940" width="150" height="210" rx="10"/>
    <rect x="350" y="940" width="150" height="210" rx="10"/>
    <rect x="520" y="940" width="150" height="210" rx="10"/>
    <rect x="690" y="940" width="150" height="210" rx="10"/>
    <rect x="860" y="940" width="150" height="210" rx="10"/>
  </g>

  <!-- handle dots on each door -->
  <g fill="#FFFFFF" opacity="0.28">
    <circle cx="300" cy="585" r="4"/>
    <circle cx="470" cy="585" r="4"/>
    <circle cx="640" cy="585" r="4"/>
    <circle cx="810" cy="585" r="4"/>
    <circle cx="980" cy="585" r="4"/>
    <circle cx="300" cy="815" r="4"/>
    <circle cx="470" cy="815" r="4"/>
    <circle cx="640" cy="815" r="4"/>
    <circle cx="810" cy="815" r="4"/>
    <circle cx="980" cy="815" r="4"/>
    <circle cx="300" cy="1045" r="4"/>
    <circle cx="470" cy="1045" r="4"/>
    <circle cx="810" cy="1045" r="4"/>
    <circle cx="980" cy="1045" r="4"/>
  </g>

  <!-- one door "popped open" — brighter, ajar -->
  <rect x="520" y="940" width="150" height="210" rx="10" fill="#FFFFFF" opacity="0.14"/>
  <rect x="520" y="940" width="150" height="210" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.6"/>
  <g opacity="0.75" transform="translate(660,970) rotate(18)">
    <rect x="0" y="0" width="70" height="150" rx="8" fill="#0071E3" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="58" cy="75" r="4" fill="#FFFFFF"/>
  </g>
</svg>
