<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="900" cy="260" r="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="260" cy="1340" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- kiosk device outline -->
  <g transform="translate(430,420)">
    <rect x="0" y="0" width="340" height="620" rx="34" fill="#FFFFFF" opacity="0.08"/>
    <rect x="0" y="0" width="340" height="620" rx="34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <rect x="24" y="36" width="292" height="548" rx="18" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.3"/>

    <!-- status bar -->
    <rect x="48" y="60" width="120" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>

    <!-- menu slices -->
    <rect x="48" y="110" width="244" height="72" rx="14" fill="#FFFFFF" opacity="0.10"/>
    <rect x="48" y="110" width="244" height="72" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.35"/>

    <rect x="48" y="198" width="244" height="72" rx="14" fill="#0071E3" opacity="0.55"/>
    <rect x="48" y="198" width="244" height="72" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.6"/>

    <rect x="48" y="286" width="244" height="72" rx="14" fill="#FFFFFF" opacity="0.10"/>
    <rect x="48" y="286" width="244" height="72" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.3"/>

    <rect x="48" y="374" width="244" height="72" rx="14" fill="#FFFFFF" opacity="0.08"/>
    <rect x="48" y="374" width="244" height="72" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.25"/>

    <rect x="48" y="462" width="244" height="72" rx="14" fill="#FFFFFF" opacity="0.06"/>
    <rect x="48" y="462" width="244" height="72" rx="14" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.2"/>

    <!-- tap / cursor indicator on highlighted slice -->
    <circle cx="270" cy="234" r="20" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="270" cy="234" r="34" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.35"/>
  </g>
</svg>
