<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="250" cy="280" r="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="960" cy="1320" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- stack of reservation / badge cards -->
  <g transform="translate(600,820)">
    <g transform="rotate(-14) translate(-260,-150)">
      <rect x="0" y="0" width="360" height="230" rx="24" fill="#FFFFFF" opacity="0.10"/>
      <rect x="0" y="0" width="360" height="230" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.35"/>
      <circle cx="60" cy="60" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.4"/>
      <line x1="120" y1="50" x2="300" y2="50" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
      <line x1="120" y1="80" x2="260" y2="80" stroke="#FFFFFF" stroke-width="4" opacity="0.22"/>
    </g>

    <g transform="rotate(6) translate(-200,-40)">
      <rect x="0" y="0" width="400" height="250" rx="24" fill="#FFFFFF" opacity="0.14"/>
      <rect x="0" y="0" width="400" height="250" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.5"/>
      <circle cx="330" cy="60" r="30" fill="#0071E3" opacity="0.9"/>
      <path d="M316 60 l10 10 l20 -22" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="40" y1="60" x2="220" y2="60" stroke="#FFFFFF" stroke-width="5" opacity="0.4"/>
      <line x1="40" y1="95" x2="180" y2="95" stroke="#FFFFFF" stroke-width="5" opacity="0.28"/>
      <line x1="40" y1="170" x2="360" y2="170" stroke="#FFFFFF" stroke-width="1.4" stroke-dasharray="6 8" opacity="0.35"/>
    </g>

    <g transform="rotate(-3) translate(-150,120)">
      <rect x="0" y="0" width="340" height="150" rx="20" fill="#FFFFFF" opacity="0.10"/>
      <rect x="0" y="0" width="340" height="150" rx="20" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.4"/>
      <rect x="30" y="35" width="60" height="60" rx="8" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.45"/>
      <line x1="110" y1="45" x2="280" y2="45" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
      <line x1="110" y1="75" x2="240" y2="75" stroke="#FFFFFF" stroke-width="4" opacity="0.2"/>
    </g>
  </g>
</svg>
