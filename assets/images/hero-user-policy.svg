<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="240" cy="280" r="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="960" cy="1340" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- group clusters of "people" (avatar dots) -->
  <g fill="#FFFFFF">
    <!-- group A -->
    <circle cx="360" cy="480" r="46" opacity="0.22"/>
    <circle cx="440" cy="450" r="46" opacity="0.30"/>
    <circle cx="400" cy="540" r="46" opacity="0.26"/>
    <circle cx="480" cy="530" r="46" opacity="0.18"/>
  </g>
  <circle cx="420" cy="495" r="130" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.35" stroke-dasharray="4 8"/>

  <g fill="#FFFFFF">
    <!-- group B -->
    <circle cx="820" cy="760" r="46" opacity="0.22"/>
    <circle cx="900" cy="730" r="46" opacity="0.32"/>
    <circle cx="860" cy="820" r="46" opacity="0.24"/>
    <circle cx="940" cy="800" r="46" opacity="0.20"/>
    <circle cx="780" cy="840" r="46" opacity="0.18"/>
  </g>
  <circle cx="865" cy="782" r="150" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.35" stroke-dasharray="4 8"/>

  <g fill="#FFFFFF">
    <!-- group C -->
    <circle cx="330" cy="1100" r="46" opacity="0.22"/>
    <circle cx="410" cy="1080" r="46" opacity="0.30"/>
    <circle cx="370" cy="1170" r="46" opacity="0.24"/>
  </g>
  <circle cx="375" cy="1120" r="120" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.35" stroke-dasharray="4 8"/>

  <!-- connecting lines from groups to a central access badge -->
  <g stroke="#FFFFFF" stroke-width="1.4" opacity="0.25">
    <line x1="420" y1="495" x2="700" y2="1020"/>
    <line x1="865" y1="782" x2="700" y2="1020"/>
    <line x1="375" y1="1120" x2="700" y2="1020"/>
  </g>

  <!-- central access / key badge -->
  <g transform="translate(700,1020)">
    <circle r="70" fill="#0071E3" opacity="0.6"/>
    <circle r="70" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <circle cx="-14" cy="-6" r="16" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="0" y1="4" x2="26" y2="30" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="16" y1="20" x2="26" y2="10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
