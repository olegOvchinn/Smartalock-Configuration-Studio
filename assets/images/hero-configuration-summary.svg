<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="920" cy="280" r="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="260" cy="1340" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- clipboard / summary sheet -->
  <g>
    <rect x="430" y="430" width="340" height="440" rx="22" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.3"/>
    <rect x="540" y="410" width="120" height="40" rx="10" fill="#FFFFFF" opacity="0.22"/>

    <!-- completed line items with checkmarks -->
    <g stroke-linecap="round">
      <circle cx="480" cy="510" r="14" fill="#0071E3" opacity="0.55"/>
      <path d="M473 510l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.85"/>
      <line x1="516" y1="510" x2="700" y2="510" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

      <circle cx="480" cy="580" r="14" fill="#0071E3" opacity="0.55"/>
      <path d="M473 580l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.85"/>
      <line x1="516" y1="580" x2="670" y2="580" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

      <circle cx="480" cy="650" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.4"/>
      <line x1="516" y1="650" x2="710" y2="650" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

      <circle cx="480" cy="720" r="14" fill="#0071E3" opacity="0.55"/>
      <path d="M473 720l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.85"/>
      <line x1="516" y1="720" x2="660" y2="720" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

      <circle cx="480" cy="790" r="14" fill="#0071E3" opacity="0.55"/>
      <path d="M473 790l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.4" opacity="0.85"/>
      <line x1="516" y1="790" x2="690" y2="790" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    </g>
  </g>

  <!-- floating summary chips -->
  <g opacity="0.35" stroke="#FFFFFF" stroke-width="1.6" fill="none">
    <rect x="170" y="1120" width="150" height="60" rx="30"/>
    <rect x="900" y="1180" width="150" height="60" rx="30"/>
    <rect x="230" y="1250" width="120" height="60" rx="30"/>
  </g>
</svg>
