<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B3D"/>
      <stop offset="55%" stop-color="#00408C"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4DA3FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4DA3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FC7FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8FC7FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="920" cy="280" r="380" fill="url(#glow1)" filter="url(#blur1)"/>
  <circle cx="260" cy="1340" r="440" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- catalog of varying locker-door sizes / shapes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity="0.28">
    <!-- large -->
    <rect x="160" y="420" width="230" height="330" rx="14"/>
    <!-- side -->
    <rect x="430" y="420" width="120" height="330" rx="14"/>
    <!-- top -->
    <rect x="590" y="420" width="230" height="150" rx="14"/>
    <!-- middle -->
    <rect x="590" y="590" width="230" height="150" rx="14"/>
    <!-- bottom -->
    <rect x="590" y="760" width="230" height="150" rx="14"/>
    <!-- small -->
    <rect x="860" y="420" width="150" height="150" rx="14"/>
  </g>

  <!-- one highlighted "custom" tile -->
  <rect x="860" y="610" width="150" height="300" rx="14" fill="#0071E3" opacity="0.5"/>
  <rect x="860" y="610" width="150" height="300" rx="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.65"/>
  <g stroke="#FFFFFF" stroke-width="2.4" opacity="0.8" stroke-linecap="round">
    <line x1="935" y1="730" x2="935" y2="790"/>
    <line x1="905" y1="760" x2="965" y2="760"/>
  </g>

  <!-- handle dots -->
  <g fill="#FFFFFF" opacity="0.3">
    <circle cx="360" cy="585" r="4"/>
    <circle cx="520" cy="585" r="4"/>
    <circle cx="790" cy="495" r="4"/>
    <circle cx="790" cy="665" r="4"/>
    <circle cx="790" cy="835" r="4"/>
    <circle cx="980" cy="495" r="4"/>
  </g>

  <!-- spec / measurement ticks under the grid -->
  <g stroke="#FFFFFF" stroke-width="1.4" opacity="0.3">
    <line x1="160" y1="800" x2="390" y2="800"/>
    <line x1="160" y1="792" x2="160" y2="808"/>
    <line x1="390" y1="792" x2="390" y2="808"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.4" opacity="0.24">
    <line x1="430" y1="800" x2="550" y2="800"/>
    <line x1="430" y1="792" x2="430" y2="808"/>
    <line x1="550" y1="792" x2="550" y2="808"/>
  </g>
</svg>
