</head>


<body>


<header class="app-header">

<nav class="top-nav">

Smartalock

<a href="reports.html">

</a>

</div>

</nav>

</header>




<main class="register-page">


<section class="register-header">

<h1>
Register
</h1>

<p>
Create a new Smartalock project
</p>

</section>




<section class="register-card">


<h2>
Company Details
</h2>


<label>
Company Name
</label>

<input value="">


<label>
Site Address
</label>

<input value="">


<label>
Your Email
</label>

<input value="">



<h2>
Contacts
</h2>


<label>
Policy Contact (if different)
</label>

<input value="">



<label>
IT Contact (if different)
</label>

<input value="">



<label>
Training Contact (if any)
</label>

<input value="">



<label>
Support / Helpdesk Contact
</label>

<input value="">



<label>
Facilities Contact
</label>

<input value="">



<h2>
Project Dates
</h2>


<label>
Target Installation Date
</label>

<input type="date" value="">



<label>
Target Completion Date
</label>

<input type="date" value="">



<button 
class="primary-button"
onclick="registerProject()">

Register

</button>


</section>


</main>





<script src="../js/project.js"></script>

<script>

const project = loadProject();

if (project && project.registration) {

    const r = project.registration;

    document.getElementById("projectTitle").textContent =
        `${r.customer || "-"} - ${r.site || "-"}`;

    document.getElementById("reportCompany").textContent =
        r.customer || "-";

    document.getElementById("reportSite").textContent =
        r.site || "-";

    document.getElementById("reportEmail").textContent =
        r.email || "-";

    document.getElementById("reportPolicy").textContent =
        r.policy || "-";

    document.getElementById("reportIT").textContent =
        r.it || "-";

    document.getElementById("reportTraining").textContent =
        r.training || "-";

    document.getElementById("reportSupport").textContent =
        r.support || "-";

    document.getElementById("reportFacilities").textContent =
        r.facilities || "-";

    document.getElementById("reportInstallation").textContent =
        r.installationDate || "-";

    document.getElementById("reportCompletion").textContent =
        r.completionDate || "-";

}

function registerProject() {

const project = loadProject();

const inputs = document.querySelectorAll("input");

project.registration.customer = inputs[0].value;
project.registration.site = inputs[1].value;
project.registration.email = inputs[2].value;

project.registration.policy = inputs[3].value;
project.registration.it = inputs[4].value;
project.registration.training = inputs[5].value;
project.registration.support = inputs[6].value;
project.registration.facilities = inputs[7].value;

project.registration.installationDate = inputs[8].value;
project.registration.completionDate = inputs[9].value;

saveProject(project);

window.location.href = "project-home.html";

}

</script>


</body>

</html>
